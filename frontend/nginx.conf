server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward API calls to the Django container
    location /api/ {
        proxy_pass http://backend:8000;
        # Django is only reachable through here, so always present the internal
        # host name - the app then works from localhost, 0.0.0.0, a LAN IP or a domain.
        proxy_set_header Host backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
